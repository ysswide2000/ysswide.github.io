<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 40px 20px;
        }
        main {
            padding: 40px 20px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 20px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #45a049;
        }

</head>
<body>

    <header>
        <h1>Добро пожаловать на мой сайт!</h1>
        <p>Это простая веб-страница на HTML и CSS.</p>
    </header>

    <main>
        <h2>Обо мне</h2>
        <p>Я учусь создавать сайты. Здесь будет находиться моя личная информация или проект.</p>
        <a href="mailto:example@email.com" class="btn">Связаться со мной</a>
    </main>

    <footer>
        <p>&copy; 2026 Мой сайт. Все права защищены.</p>
    </footer>

</body>
</html>
